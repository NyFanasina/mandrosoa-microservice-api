# for development purpose only
services:
  auth_service:
    build: ./services/auth
    ports:
      - 8001:8001
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@auth_db:5432/auth_service
      SECRET_KEY: 7e828f55eb59635be7c8c3bc80156c8f
    volumes:
      - ./services/auth:/code
    networks:
      - mandrosoa
  auth_db:
    image: postgres:18.4-alpine
    ports:
      - 5001:5432
    volumes:
      - postgres_auth_data:/var/lib/postgresql
    networks:
      - mandrosoa
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  user_service:
    build: ./services/user
    ports:
      - 8002:8002
    depends_on:
      user_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@user_db:5432/user_service
    volumes:
      - ./services/user:/code
    networks:
      - mandrosoa
  user_db:
    image: postgres:18.4-alpine
    ports:
      - 5002:5432
    volumes:
      - postgres_user_data:/var/lib/postgresql
    networks:
      - mandrosoa
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  mandrosoa:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_user_data:
